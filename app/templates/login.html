{% extends "base.html" %}
{% block content %}
<div class="panel panel-center">
  <p class="eyebrow">Contact Manager</p>
  <h1>Welcome back</h1>
  <p class="panel-foot" style="margin-top:6px;margin-bottom:20px;">Sign in to reach your contacts.</p>
  <form method="POST">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="panel-foot">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</div>
{% endblock %}
