{% extends "base.html" %}
{% block content %}
<p class="eyebrow">{{ 'Edit entry' if contact else 'New entry' }}</p>
<h1 style="margin-bottom:24px;">{{ 'Edit Contact' if contact else 'Add Contact' }}</h1>

<div class="panel panel-wide">
  <form method="POST" enctype="multipart/form-data">
    <div class="field">
      <label for="name">Name *</label>
      <input type="text" id="name" name="name" value="{{ contact.name if contact else '' }}" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ contact.email if contact else '' }}">
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" value="{{ contact.phone if contact else '' }}">
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes">{{ contact.notes if contact else '' }}</textarea>
    </div>
    <div class="field">
      <label for="profile_image">Profile Image</label>
      <input type="file" id="profile_image" name="profile_image" accept="image/*">
      {% if contact and contact.profile_image_url %}
        <img src="{{ contact.profile_image_url }}" class="existing-photo" alt="">
      {% endif %}
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save Contact</button>
      <a href="{{ url_for('contacts.list_contacts') }}" style="font-family:var(--font-mono);font-size:0.85rem;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
